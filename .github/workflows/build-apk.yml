name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Секрети передаємо через env, а не підставляємо прямо в скрипт.
      - name: Create local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          for name in SUPABASE_URL SUPABASE_ANON_KEY GOOGLE_WEB_CLIENT_ID; do
            if [ -z "${!name}" ]; then echo "::error::Секрет $name не задано"; exit 1; fi
          done
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
          } > local.properties

      # Єдиний ключ підпису (docs/signing.md). Без нього збірку зупиняємо: APK із випадковим ключем
      # раннера не ставиться поверх уже встановленого застосунку.
      - name: Restore signing keystore
        env:
          MAPA_KEYSTORE_BASE64: ${{ secrets.MAPA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MAPA_KEYSTORE_BASE64" ]; then echo "::error::Секрет MAPA_KEYSTORE_BASE64 не задано (docs/signing.md)"; exit 1; fi
          echo "$MAPA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mapa-release.jks"
          echo "MAPA_KEYSTORE_FILE=$RUNNER_TEMP/mapa-release.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          MAPA_KEYSTORE_PASSWORD: ${{ secrets.MAPA_KEYSTORE_PASSWORD }}
          MAPA_KEY_ALIAS: ${{ secrets.MAPA_KEY_ALIAS }}
          MAPA_KEY_PASSWORD: ${{ secrets.MAPA_KEY_PASSWORD }}
        run: |
          for name in MAPA_KEYSTORE_PASSWORD MAPA_KEY_ALIAS MAPA_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Секрет $name не задано (docs/signing.md)"; exit 1; fi
          done
          chmod +x gradlew
          ./gradlew assembleDebug

      # Відбиток сертифіката (не секрет): має збігатися з локальною збіркою — тоді оновлення ставиться поверх.
      # Крок падає лише коли APK не підписано, підпис не проходить перевірку або це стандартний debug-ключ.
      - name: Verify signature
        shell: bash
        run: |
          set -u
          APK=app/build/outputs/apk/debug/app-debug.apk

          echo "== app/build/outputs/apk/"
          ls -laR app/build/outputs/apk/ || echo "(каталогу немає)"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner не знайдено в $ANDROID_HOME/build-tools"; exit 1
          fi
          echo "== apksigner: $APKSIGNER"

          if [ ! -f "$APK" ]; then
            echo "::error::APK не знайдено: $APK"; exit 1
          fi

          # Повний вивід без фільтрів — там лише публічний сертифікат.
          set +e
          VERIFY_OUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          VERIFY_RC=$?
          set -e
          echo "== apksigner verify (код $VERIFY_RC)"
          echo "$VERIFY_OUT"

          if [ "$VERIFY_RC" -ne 0 ]; then
            echo "::error::apksigner verify завершився з кодом $VERIFY_RC: APK не підписано або підпис недійсний"; exit 1
          fi

          CERT_SHA256="$(echo "$VERIFY_OUT" | grep -i "certificate SHA-256 digest" | head -1 | sed 's/.*[Dd]igest:[[:space:]]*//' || true)"
          CERT_DN="$(echo "$VERIFY_OUT" | grep -i "certificate DN" | head -1 | sed 's/.*DN:[[:space:]]*//' || true)"

          if [ -z "$CERT_SHA256" ]; then
            echo "::error::У виводі apksigner немає 'certificate SHA-256 digest' — сертифікат підписувача не знайдено"; exit 1
          fi
          # Стандартний debug-ключ означає, що наш keystore не підхопився (такий APK не стане поверх).
          if echo "$CERT_DN" | grep -qi "CN=Android Debug"; then
            echo "::error::APK підписано стандартним debug-ключем ($CERT_DN), а не ключем mapa"; exit 1
          fi

          echo "Сертифікат: $CERT_DN"
          echo "SHA-256:    $CERT_SHA256"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/mapa-release.jks" local.properties

      - uses: actions/upload-artifact@v4
        with:
          name: mapa-inkluzyvnosti-debug
          path: app/build/outputs/apk/debug/app-debug.apk
